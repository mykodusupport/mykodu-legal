<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勤務画面 - ぼくのお小遣い帳 使い方</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
  <header class="page-header">
    <div class="app-name">ぼくのお小遣い帳</div>
    <h1>勤務画面</h1>
  </header>
  <main>
    <p class="note">画像は準備中です。</p>
    <h2>バイト先を登録する</h2>
    <ul>
      <li>バイト先ごとに、時給を登録します。</li>
      <li>日当が決まっているお仕事は、日当で登録できます。</li>
    </ul>
    <h2>シフトを記録する</h2>
    <ul>
      <li>カレンダーの日付から、出勤したシフトを記録します。</li>
      <li>記録すると、月間の給料が自動で計算されます。</li>
    </ul>
    <h2>実際に振り込まれた給料を入力する</h2>
    <p>画面上部の「実際に振り込まれた給料を入力する」から、振り込まれた金額を入力すると、見込みの給料と比べられます。</p>
    <p><a href="../guide.html">使い方の一覧に戻る</a></p>
  </main>
  <footer>&copy; 2026 佐藤碧唯 - ぼくのお小遣い帳</footer>
</div>

</html>
