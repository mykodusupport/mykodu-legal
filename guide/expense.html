<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支出画面 - ぼくのお小遣い帳 使い方</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
  <header class="page-header">
    <div class="app-name">ぼくのお小遣い帳</div>
    <h1>支出画面</h1>
  </header>
  <main>
    <p class="note">画像は準備中です。</p>
    <h2>支出を見る</h2>
    <ul>
      <li>カレンダーの各日付に、その日の合計金額が表示されます。</li>
      <li>上部で月を切り替えると、前の月・次の月の支出を見られます。</li>
      <li>日付をタップすると、その日の明細が開きます。</li>
    </ul>
    <h2>支出を追加・編集・削除する</h2>
    <ul>
      <li>明細画面で、支出の追加・編集・削除ができます。</li>
      <li>金額は、9桁までの数字で入力します。</li>
    </ul>
    <h2>検索</h2>
    <p>画面右上の検索アイコンから、カテゴリ名やメモの文字で過去の支出を探せます。</p>
    <p><a href="../guide.html">使い方の一覧に戻る</a></p>
  </main>
  <footer>&copy; 2026 佐藤碧唯 - ぼくのお小遣い帳</footer>
</div>
</body>
</html>
