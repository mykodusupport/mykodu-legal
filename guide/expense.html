<body>
<div class="wrap">
  <header class="page-header">
    <div class="app-name">ぼくのお小遣い帳</div>
    <h1>支出画面</h1>
  </header>
  <main>
    <h2>画面の写真</h2>
    <p><img src="../images/expense/shot01.jpg" alt="支出画面 写真1" loading="lazy" style="max-width:100%;height:auto;border:1px solid #ddd;border-radius:12px"></p>
    <p><img src="../images/expense/shot02.jpg" alt="支出画面 写真2" loading="lazy" style="max-width:100%;height:auto;border:1px solid #ddd;border-radius:12px"></p>
    <p><img src="../images/expense/shot03.jpg" alt="支出画面 写真3" loading="lazy" style="max-width:100%;height:auto;border:1px solid #ddd;border-radius:12px"></p>
    <p><img src="../images/expense/shot04.jpg" alt="支出画面 写真4" loading="lazy" style="max-width:100%;height:auto;border:1px solid #ddd;border-radius:12px"></p>
    <p><img src="../images/expense/shot05.jpg" alt="支出画面 写真5" loading="lazy" style="max-width:100%;height:auto;border:1px solid #ddd;border-radius:12px"></p>
    <p><img src="../images/expense/shot06.jpg" alt="支出画面 写真6" loading="lazy" style="max-width:100%;height:auto;border:1px solid #ddd;border-radius:12px"></p>
    <p><img src="../images/expense/shot07.jpg" alt="支出画面 写真7" loading="lazy" style="max-width:100%;height:auto;border:1px solid #ddd;border-radius:12px"></p>
    <p><img src="../images/expense/shot08.jpg" alt="支出画面 写真8" loading="lazy" style="max-width:100%;height:auto;border:1px solid #ddd;border-radius:12px"></p>
    <p><img src="../images/expense/shot09.jpg" alt="支出画面 写真9" loading="lazy" style="max-width:100%;height:auto;border:1px solid #ddd;border-radius:12px"></p>
    <h2>操作の動画</h2>
    <p><video src="../videos/expense/movie01.mp4" controls playsinline preload="metadata" style="max-width:100%;height:auto;border-radius:12px"></video></p>
    <p><video src="../videos/expense/movie02.mp4" controls playsinline preload="metadata" style="max-width:100%;height:auto;border-radius:12px"></video></p>
    <p><video src="../videos/expense/movie03.mp4" controls playsinline preload="metadata" style="max-width:100%;height:auto;border-radius:12px"></video></p>
    <h2>支出を見る</h2>
    <ul>
      <li>カレンダーの各日付に、その日の合計金額が表示されます。</li>
      <li>上部で月を切り替えると、前の月・次の月の支出を見られます。</li>
      <li>日付をタップすると、その日の明細が開きます。</li>
    </ul>
    <h2>支出を追加・編集・削除する</h2>
    <ul>
      <li>明細画面で、支出の追加・編集・削除ができます。</li>
      <li>金額は、9桁までの数字で入力します。</li>
    </ul>
    <h2>検索</h2>
    <p>画面右上の検索アイコンから、カテゴリ名やメモの文字で過去の支出を探せます。</p>
    <p><a href="../guide.html">使い方の一覧に戻る</a></p>
  </main>
  <footer>&copy; 2026 佐藤碧唯 - ぼくのお小遣い帳</footer>
